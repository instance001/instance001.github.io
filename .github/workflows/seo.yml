name: Refresh SEO Surfaces

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Pages repo
        uses: actions/checkout@v4

      - name: Check out Whatisthisgithub source
        run: git clone --depth 1 https://github.com/instance001/Whatisthisgithub ../Whatisthisgithub

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync ORCID public record
        run: node scripts/sync-orcid-public-record.mjs

      - name: Generate public record, sitemap, and repo atlas
        env:
          REPO_INDEX_README: ../Whatisthisgithub/README.md
        run: node scripts/generate-seo.mjs

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public-record.json public-record.html repo-directory.html sitemap.xml sitemap.txt
          if git diff --cached --quiet; then
            echo "No SEO changes to commit."
            exit 0
          fi
          git commit -m "Refresh public record, sitemap, and repo atlas"
          git push
